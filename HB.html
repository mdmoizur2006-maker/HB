<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    background: linear-gradient(
        135deg,
        #ff758c 0%,
        #ff7eb3 100%
    );

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;

    overflow: hidden;

    perspective: 1000px;
}


/* =====================================================
   MAIN CARD
===================================================== */

.container {

    background: rgba(255, 255, 255, 0.95);

    padding: 40px 30px;

    border-radius: 24px;

    text-align: center;

    width: 90%;
    max-width: 550px;

    max-height: 90vh;

    overflow-y: auto;

    box-shadow: 0 20px 40px rgba(0,0,0,0.2);

    transition: all 0.5s ease;

    backdrop-filter: blur(10px);

    border: 1px solid rgba(255,255,255,0.4);

    z-index: 10;
}


/* =====================================================
   HEADINGS
===================================================== */

h1 {

    color: #ff0066;

    font-size: 2.2rem;

    margin-bottom: 20px;

    text-shadow:
        1px 1px 2px rgba(0,0,0,0.1);
}


/* =====================================================
   PARAGRAPH
===================================================== */

p {

    font-size: 18px;

    color: #444;

    line-height: 1.6;

    margin: 20px 0;
}


/* =====================================================
   NORMAL BUTTON
===================================================== */

button {

    padding: 16px 40px;

    font-size: 20px;

    font-weight: bold;

    background:
        linear-gradient(
            45deg,
            #ff0066,
            #ff5e62
        );

    color: white;

    border: none;

    border-radius: 50px;

    cursor: pointer;

    box-shadow:
        0 10px 20px
        rgba(255,0,102,0.3);

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}


button:hover {

    transform: translateY(-3px);

    box-shadow:
        0 15px 25px
        rgba(255,0,102,0.4);
}


button:active {

    transform: translateY(-1px);
}


/* =====================================================
   PAGE SYSTEM
===================================================== */

.page {

    display: none;

    animation: pageAppear 0.6s ease;
}


.page.active {

    display: block;
}


@keyframes pageAppear {

    from {

        opacity: 0;

        transform:
            scale(0.9)
            translateY(20px);
    }

    to {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }
}


/* =====================================================
   PASSWORD PAGE
===================================================== */

.password-title {

    font-size: 2rem;

    margin-bottom: 10px;
}


.password-subtitle {

    font-size: 16px;

    color: #777;

    margin-bottom: 25px;
}


/* =====================================================
   PASSWORD DISPLAY
===================================================== */

.password-display {

    width: 220px;

    min-height: 55px;

    margin: 0 auto 25px auto;

    padding: 12px;

    border-radius: 15px;

    background: #fff;

    border: 2px solid #ff7eb3;

    box-shadow:
        inset 0 3px 8px
        rgba(0,0,0,0.08);

    font-size: 25px;

    font-weight: bold;

    letter-spacing: 10px;

    color: #ff0066;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;
}


/* Empty password display */

.password-placeholder {

    color: #ccc;

    letter-spacing: 2px;

    font-size: 15px;

}


/* =====================================================
   CUSTOM KEYBOARD
===================================================== */

.keyboard {

    display: grid;

    grid-template-columns:
        repeat(3, 55px);

    grid-auto-rows: 55px;

    justify-content: center;

    gap: 9px;

    margin: 10px auto 20px auto;
}


.key {

    width: 55px;

    height: 55px;

    padding: 0;

    border-radius: 14px;

    border: none;

    background:
        linear-gradient(
            145deg,
            #ff5e8a,
            #ff0066
        );

    color: white;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 10px
        rgba(255,0,102,0.25);

    transition:
        transform 0.12s,
        box-shadow 0.12s;
}


.key:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 14px
        rgba(255,0,102,0.3);
}


.key:active {

    transform:
        scale(0.9);
}


/* =====================================================
   DELETE BUTTON
===================================================== */

.delete-btn {

    width: 120px;

    height: 40px;

    padding: 0;

    margin-top: 5px;

    border-radius: 20px;

    background: #555;

    font-size: 14px;

    box-shadow: none;
}


.delete-btn:hover {

    background: #333;

    box-shadow: none;
}


/* =====================================================
   PASSWORD ERROR
===================================================== */

.password-error {

    height: 24px;

    margin-top: 5px;

    color: #ff1744;

    font-size: 14px;

    font-weight: bold;

    opacity: 0;

    transition: opacity 0.3s;
}


.password-error.show {

    opacity: 1;

    animation: shake 0.3s;
}


@keyframes shake {

    0%,100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-6px);
    }

    75% {
        transform: translateX(6px);
    }
}


/* =====================================================
   NEXT PAGE
===================================================== */

.next-page-text {

/* =====================================================
   DECORATIONS
===================================================== */

.decor {

    margin: 20px 0;

@keyframes bounce {

    0%,100% {

    }

    50% {

    }

   BIRTHDAY PHOTO
===================================================== */

===================================================== */

.confetti,

<script>

/* =====================================================
   PASSWORD
===================================================== */

const correctPassword = "ASH";

let enteredPassword = "";


/* =====================================================
   PASSWORD KEY PRESS
===================================================== */

function pressKey(letter) {

    /*
       Maximum password length = 3
    */

    if (enteredPassword.length >= correctPassword.length) {
        return;
    }


    /*
       Add pressed letter
    */

    enteredPassword += letter;


    /*
       Update display
    */

    updatePasswordDisplay();


    /*
       Check password
    */

    if (enteredPassword.length === correctPassword.length) {

        setTimeout(function() {

            if (enteredPassword === correctPassword) {

                /*
                   Correct password
                   Move automatically to page 2
                */

                showPage("nextPage");

            } else {

                /*
                   Wrong password
                */

                showWrongPassword();

            }

        }, 250);
    }
}



/* =====================================================
   UPDATE PASSWORD DISPLAY
===================================================== */

function updatePasswordDisplay() {

    const display =
        document.getElementById("passwordDisplay");


    if (enteredPassword.length === 0) {

        display.innerHTML =
            '<span class="password-placeholder">' +
            'Enter password' +
            '</span>';

    } else {

        /*
           Show entered letters
        */

        display.textContent =
            enteredPassword;
    }
}



/* =====================================================
   DELETE LAST LETTER
===================================================== */

function deleteKey() {

    if (enteredPassword.length > 0) {

        enteredPassword =
            enteredPassword.slice(0, -1);

        updatePasswordDisplay();
    }


    /*
       Hide error
    */

    document
        .getElementById("passwordError")
        .classList.remove("show");
}



/* =====================================================
   WRONG PASSWORD
===================================================== */

function showWrongPassword() {

    const error =
        document.getElementById("passwordError");


    error.classList.add("show");


    /*
       Clear password
    */

    enteredPassword = "";


    /*
       Update display after short delay
    */

    setTimeout(function() {

        updatePasswordDisplay();

    }, 400);
}



/* =====================================================
   SHOW PAGE
===================================================== */

function showPage(pageId) {

    /*
       Hide all pages
    */

    document
        .querySelectorAll(".page")
        .forEach(function(page) {

            page.classList.remove("active");

        });


    /*
       Show requested page
    */

    document
        .getElementById(pageId)
        .classList.add("active");
}



/* =====================================================
   PAGE 3
===================================================== */

function openBirthdayPage() {

    showPage("birthdayPage");

    document.body.classList.add("birthday-mode");

    // Play birthday audio
    const audio = document.getElementById("birthdayAudio");
    audio.currentTime = 0;
    audio.play().catch(function(error) { 
        console.log("Audio playback was blocked:", error); });

    typeWriter(message, 0);
 
    createConfetti();

    createHearts();
}



/* =====================================================
   BIRTHDAY MESSAGE
===================================================== */

const message = `Happy Birthday! 🌷

On your special day, I sincerely pray that Allah fills your life with endless peace, happiness, good health, and barakah. May He protect you from every hardship, guide you toward everything that is good for you, and bless every step you take.

Some bonds are difficult to describe with a single word. They are simply understood through the respect, comfort, trust, and quiet care they carry. I’m genuinely grateful to have such a beautiful bond with you—one that I will always value and respect.

May Allah keep your heart peaceful, your days meaningful, and your future brighter than you imagine. May every sincere dua you make find its way to you at the right time.

Wishing you a beautiful birthday and a life filled with countless reasons to smile.

May Allah always keep you under His protection and bless you abundantly. Ameen. 🤍`;



/* =====================================================
   TYPEWRITER
===================================================== */
  
function typeWriter(text, i) {

    if (i < text.length) {

        document
            .getElementById("birthday-text")
            .innerHTML =
            text.substring(0, i + 1) +
            '<span aria-hidden="true">|</span>';


        setTimeout(function() {

            typeWriter(text, i + 1);

        }, 35);

    } else {

        /*
           Remove cursor
        */

        document
            .getElementById("birthday-text")
            .textContent = text;
    }
}



/* =====================================================
   CONFETTI
===================================================== */

function createConfetti() {

    for (let i = 0; i < 100; i++) {

        let c =
            document.createElement("div");


        c.className = "confetti";


        c.style.width =
            Math.random() * 12 + 8 + "px";


        c.style.height =
            Math.random() * 12 + 8 + "px";


        c.style.left =
            Math.random() * 100 + "vw";


        c.style.backgroundColor =
            "hsl(" +
            Math.random() * 360 +
            ", 100%, 60%)";


        c.style.animation =
            "fall " +
            (2 + Math.random() * 3) +
            "s linear forwards";


        document.body.appendChild(c);


        setTimeout(function() {

            c.remove();

        }, 5000);
    }
}



/* =====================================================
   FLOATING HEARTS
===================================================== */

function createHearts() {

    for (let i = 0; i < 30; i++) {

        let h =
            document.createElement("div");


        h.className = "heart";


        h.innerHTML =
            Math.random() > 0.5
            ? "❤️"
            : "💙";


        h.style.fontSize =
            Math.random() * 15 + 15 + "px";


        h.style.left =
            Math.random() * 100 + "vw";


        h.style.animation =
            "fall " +
            (3 + Math.random() * 3) +
            "s linear forwards";


        h.style.animationDelay =
            Math.random() * 1.5 + "s";


        document.body.appendChild(h);


        setTimeout(function() {

            h.remove();

        }, 6000);
    }
}

/* =====================================================
   FULL SCREEN IMAGE VIEWER
===================================================== */

function openImageViewer(imageSrc) {

    const viewer =
        document.getElementById("imageViewer");

    const fullImage =
        document.getElementById("fullScreenImage");

    fullImage.src = imageSrc;

    viewer.classList.add("show");
}


function closeImageViewer(event) {

    if (event) {
        event.stopPropagation();
    }

    const viewer =
        document.getElementById("imageViewer");

    const fullImage =
        document.getElementById("fullScreenImage");

    viewer.classList.remove("show");

    fullImage.src = "";
}


/* Close with ESC */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        closeImageViewer();

    }

});

</script>
